function decode(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const hud = document.getElementById('hud');
const metaEl = document.getElementById('meta');
const noteEl = document.getElementById('note');
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');

let memory = null;
const chunks = [];

// The module's imports. Output is a BYTE SINK - the page never formats a number,
// or the browser and the native run would stop being comparable.
const imports = {
  env: {
    write: (ptr, len) => { chunks.push(new Uint8Array(memory.buffer, ptr, len).slice()); },
    // A serial date in the interpreter's convention: days since 1899-12-30, LOCAL
    // time. 25569 is the offset to the Unix epoch; getTimezoneOffset() is minutes
    // WEST of UTC, hence the subtraction.
    now: () => { const d = new Date();
                 return (d.getTime() - d.getTimezoneOffset() * 60000) / 86400000 + 25569; },
    // WebAssembly has no transcendental instructions, so the host supplies them.
    sin: Math.sin,   cos: Math.cos,   tan: Math.tan,   atn: Math.atan,
    exp: Math.exp,   log: Math.log,   log10: Math.log10, log2: Math.log2,
    asin: Math.asin, acos: Math.acos, sinh: Math.sinh, cosh: Math.cosh
  }
};

let X, W, H, FB, img, px;
try {
  const bytes = decode(B64);
  X = new WebAssembly.Instance(new WebAssembly.Module(bytes), imports).exports;
  memory = X.memory;
  X.main();                       // builds the world and draws frame 0
  W = X.screen_w.value; H = X.screen_h.value; FB = X.screen_ptr.value;
  cv.width = W; cv.height = H;
  img = ctx.createImageData(W, H);
  px = img.data;
  metaEl.textContent = bytes.length.toLocaleString() + ' bytes of wasm · ' + W + '×' + H;
} catch (e) {
  document.body.innerHTML = '<pre class="err">' + e.message + '</pre>';
  throw e;
}

// ⚠️ ARGB -> RGBA. A framebuffer word is 0xAARRGGBB, so in little-endian memory
// the bytes run B,G,R,A while ImageData wants R,G,B,A: red and blue have to be
// exchanged. A straight copy renders a blue sky ORANGE - and no numeric test can
// see it, because the pixel VALUES are right either way.
// ⭐ A WORD at a time, not four bytes: the framebuffer word is 0xAARRGGBB and
// ImageData, read as u32 on a little-endian machine, wants 0xAABBGGRR. So the
// swap is two shifts and a mask per pixel instead of four byte loads and four
// byte stores - measured at 640x480, it took the blit from 6.2 ms to under 2.
// The views are built ONCE: memory.buffer only changes identity if the memory
// grows, and this program's screen is allocated before the first frame.
const fb32 = new Uint32Array(memory.buffer, FB, W * H);
const px32 = new Uint32Array(img.data.buffer);
function blit() {
  for (let i = 0; i < fb32.length; i++) {
    const v = fb32[i];
    px32[i] = 0xFF000000 | ((v & 0xFF) << 16) | (v & 0xFF00) | ((v >>> 16) & 0xFF);
  }
  ctx.putImageData(img, 0, 0);
}

const FRAMES = 1800;
const step = X['PROC_STEPFRAME'];
let frame = 0, running = true, last = performance.now(), acc = 0, n = 0, fps = 0;
// ⚠️ fps alone cannot tell "the code is slow" from "the browser is not asking for
// frames" - requestAnimationFrame is throttled hard in a background tab. So the
// WORK is timed separately: render and blit, in milliseconds.
let wAcc = 0, bAcc = 0, wMs = 0, bMs = 0;

if (!step) {
  noteEl.textContent = 'This module exports no PROC_STEPFRAME, so the page can only show what main() drew.';
  blit();
  hud.textContent = 'static';
} else {
  noteEl.textContent = 'The page calls one frame per animation tick, so the module returns to the ' +
                       'browser between frames — no worker and no cross-origin headers needed.';
  requestAnimationFrame(function tick(t) {
    if (running) {
      // i64 parameter: JavaScript must pass a BigInt or the call throws
      const a0 = performance.now();
      step(BigInt(frame % FRAMES));
      const a1 = performance.now();
      blit();
      const a2 = performance.now();
      wAcc += a1 - a0; bAcc += a2 - a1;
      frame++;
      acc += t - last; n++;
      if (acc >= 500) {
        fps = n * 1000 / acc; wMs = wAcc / n; bMs = bAcc / n;
        acc = 0; n = 0; wAcc = 0; bAcc = 0;
      }
      hud.textContent = 'frame ' + (frame % FRAMES) + ' · ' + fps.toFixed(1) + ' fps · render ' +
                        wMs.toFixed(1) + ' ms · blit ' + bMs.toFixed(1) + ' ms';
    }
    last = t;
    requestAnimationFrame(tick);
  });
}

document.getElementById('toggle').onclick = (e) => {
  running = !running;
  e.target.textContent = running ? 'pause' : 'resume';
};
</script>
