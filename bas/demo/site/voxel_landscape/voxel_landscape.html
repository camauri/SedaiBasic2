<style>
  /* The same visual language as every other page in this family - dark ground, monospace, the
     picture carrying the page, one warm accent. Single-theme on purpose: the subject is light drawn
     on black, so every colour is painted explicitly rather than inherited from the host. */
  :root {
    color-scheme: dark;
    --ground:  #0b0d10;
    --panel:   #161b22;
    --edge:    #262d36;
    --edge-lit:#3a444f;
    --ink:     #c9d1d9;
    --ink-dim: #7d8590;
    --accent:  #e0813f;
    --live:    #9fe8b0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    -webkit-text-size-adjust: 100%; touch-action: manipulation;
  }
  .top { width: 100%; padding: 10px 16px 0; text-align: center; font-size: 12px; }
  .top a { color: var(--ink-dim); text-decoration: none; }
  .top a:hover { color: var(--accent); }
  header { padding: 10px 16px 8px; text-align: center; }
  h1 { margin: 0 0 3px; font-size: 16px; font-weight: 600; letter-spacing: .01em; }
  .sub { color: var(--ink-dim); font-size: 12px; }
  .sub a.back { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent;
                display: inline-block; margin-top: 6px; padding: 4px 0; }
  .sub a.back:hover { border-bottom-color: var(--accent); }
  .wrap { position: relative; margin: 4px 0 8px; line-height: 0; }
  canvas {
    display: block; image-rendering: pixelated;
    width: min(94vw, 860px); height: auto; aspect-ratio: 4 / 3;
    border: 1px solid var(--edge); border-radius: 6px; background: #000;
    touch-action: manipulation;
  }
  .hud {
    position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 4px;
    background: rgba(0,0,0,.62); font-size: 11.5px; line-height: 1.45; color: var(--live);
    font-variant-numeric: tabular-nums; pointer-events: none;
    max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden;
  }
  .bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
         width: min(94vw, 860px); padding: 0 0 14px; }
  button {
    font: inherit; font-size: 12.5px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--edge); border-radius: 6px; min-height: 42px; padding: 6px 8px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: background .12s ease, border-color .12s ease;
  }
  button:hover { background: var(--edge); }
  button:active { background: var(--edge-lit); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  .note { color: var(--ink-dim); font-size: 12px; max-width: 62ch; text-align: left;
          padding: 0 18px 18px; }
  .note b { color: var(--ink); font-weight: 600; }
  .footlink { text-align: center; padding: 0 16px 30px; font-size: 13px; }
  .footlink a { color: var(--ink-dim); text-decoration: none; }
  .footlink a:hover { color: var(--accent); }
  .err { color: #ff7b72; white-space: pre-wrap; padding: 16px; }
</style>

function decode(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const hud = document.getElementById('hud');
const noteEl = document.getElementById('note');
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');

let memory = null;

// Output is a BYTE SINK - the page never formats a number, or the browser and the native run would
// stop being comparable. WebAssembly has no transcendental instructions, so the host supplies them.
const imports = { env: {
  write: (ptr, len) => { console.log(new TextDecoder().decode(new Uint8Array(memory.buffer, ptr, len))); },
  now: () => { const d = new Date();
               return (d.getTime() - d.getTimezoneOffset() * 60000) / 86400000 + 25569; },
  sin: Math.sin,   cos: Math.cos,   tan: Math.tan,   atn: Math.atan,
  exp: Math.exp,   log: Math.log,   log10: Math.log10, log2: Math.log2,
  asin: Math.asin, acos: Math.acos, sinh: Math.sinh, cosh: Math.cosh
}};

let X, W, H, FB, img, fb32, px32, step;
const FRAMES = 1800;

// ⛔ INSTANTIATED ASYNCHRONOUSLY, and the page this replaces did not. `new WebAssembly.Module(bytes)`
// is synchronous, and a browser refuses synchronous compilation of a buffer larger than 4 KB on the
// main thread - this module is twenty times that. It ran on the desktop it was written on and would
// have failed on a phone.
WebAssembly.instantiate(decode(B64), imports).then((r) => {
  start(r.instance.exports, decode(B64).length);
}).catch((e) => {
  document.body.innerHTML =
    '<div class="err"><b>The module did not start.</b>\n\n' + e.message + '\n\n' +
    'This page compiles a WebAssembly module carried inside it. If the browser refuses to compile ' +
    'it here, the same page opened as a local file runs without that restriction.</div>';
});

function start(exports, byteLength) {
  X = exports;
  memory = X.memory;
  X.main();                       // builds the world, casts the shadows, draws frame 0
  W = X.screen_w.value; H = X.screen_h.value; FB = X.screen_ptr.value;
  cv.width = W; cv.height = H;
  img = ctx.createImageData(W, H);
  fb32 = new Uint32Array(memory.buffer, FB, W * H);
  px32 = new Uint32Array(img.data.buffer);
  step = X['PROC_STEPFRAME'];
  noteEl.innerHTML =
    '<b>What you are looking at.</b> A heightmap rendered front to back, one screen column at a ' +
    'time, each column drawn from the camera outwards with an occlusion buffer that only ever ' +
    'rises - so a ridge nearer the camera silently discards everything behind it. No polygons, no ' +
    'depth buffer, no matrix: the whole renderer is two nested loops and a comparison.' +
    '<br><br>The terrain is value noise, the colours come from altitude bands, and the sun is cast ' +
    'once into a shadow map before the first frame - all three fold into a colormap that costs ' +
    'nothing per frame. The fog is the only enrichment that depends on where the camera is.' +
    '<br><br>' + Math.round(byteLength / 1024) + '&nbsp;KB of WebAssembly, ' + W + '&times;' + H +
    '. The offline mode that writes raw frames to a file excludes itself here without a special ' +
    'case: a module has no filesystem, and the compiler refuses the opcode rather than emit ' +
    'something that runs and lies.';
  requestAnimationFrame(tick);
}

// ⛔⛔ THE VIEW IS REBUILT WHEN THE MODULE'S MEMORY GROWS, which the page this replaces did not do
// either. A typed array over memory.buffer is DETACHED the moment the WebAssembly memory grows: its
// length becomes 0, no exception is raised, and the loop below copies nothing - so the canvas
// freezes on its last frame while every counter goes on rising.
function refreshFrameView() {
  if (fb32.length === 0 || fb32.buffer !== memory.buffer) {
    FB = X.screen_ptr.value;
    fb32 = new Uint32Array(memory.buffer, FB, W * H);
  }
}

// ⚠️ ARGB -> RGBA, a WORD at a time. A framebuffer word is 0xAARRGGBB, so in little-endian memory
// the bytes run B,G,R,A while ImageData wants R,G,B,A: red and blue have to be exchanged. A straight
// copy renders a blue sky ORANGE, and no numeric test can see it - the pixel VALUES are right either
// way. Measured at 640x480, a word at a time took the blit from 6.2 ms to under 2.
function blit() {
  refreshFrameView();
  for (let i = 0; i < fb32.length; i++) {
    const v = fb32[i];
    px32[i] = 0xFF000000 | ((v & 0xFF) << 16) | (v & 0xFF00) | ((v >>> 16) & 0xFF);
  }
  ctx.putImageData(img, 0, 0);
}

let frame = 0, running = true;
let last = performance.now(), acc = 0, n = 0, fps = 0, hudAt = 0;
let wAcc = 0, bAcc = 0, wMs = 0, bMs = 0;

function tick(t) {
  if (running) {
    // ⚠️ fps alone cannot tell "the code is slow" from "the browser is not asking for frames" -
    // requestAnimationFrame is throttled hard in a background tab. So the WORK is timed separately.
    const a0 = performance.now();
    step(BigInt(frame % FRAMES));      // i64 parameter: JavaScript must pass a BigInt
    const a1 = performance.now();
    blit();
    const a2 = performance.now();
    wAcc += a1 - a0; bAcc += a2 - a1;
    frame++;
    acc += t - last; n++;
    if (acc >= 500) {
      fps = n * 1000 / acc; wMs = wAcc / n; bMs = bAcc / n;
      acc = 0; n = 0; wAcc = 0; bAcc = 0;
    }
    // ⛔ Four times a second, not sixty: a figure nobody can read is worse than none.
    if (t - hudAt >= 250) {
      hudAt = t;
      hud.textContent = fps.toFixed(0) + ' fps · render ' + wMs.toFixed(1) + ' ms · blit ' +
                        bMs.toFixed(1) + ' ms · frame ' + (frame % FRAMES);
    }
  }
  last = t;
  requestAnimationFrame(tick);
}

// A phone in a pocket should not be rendering a landscape.
document.addEventListener('visibilitychange', () => { if (document.hidden && running) setRunning(false); });

const toggleBtn = document.getElementById('toggle');
function setRunning(v) { running = v; toggleBtn.textContent = v ? 'pause' : 'resume'; }
toggleBtn.onclick = () => setRunning(!running);
document.getElementById('restart').onclick = () => { frame = 0; hudAt = 0; };
</script>
