function decode(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

  X = new WebAssembly.Instance(new WebAssembly.Module(bytes), imports).exports;
  memory = X.memory;
  X.main();                       // sets the screen up and draws the first frame
  W = X.screen_w.value; H = X.screen_h.value; FB = X.screen_ptr.value;
  cv.width = W; cv.height = H;
  img = ctx.createImageData(W, H);
  fb32 = new Uint32Array(memory.buffer, FB, W * H);
  px32 = new Uint32Array(img.data.buffer);
  noteEl.innerHTML = '<b>Click the picture to zoom in on what you clicked; right-click to zoom back out.</b> ' +
    'Every move throws the counts away and starts the seed again, so what you see after a move is a fresh ' +
    'picture of the new window rather than the old one stretched. ' +
    Math.round(bytes.length/1024) + '&nbsp;KB of WebAssembly, ' + W + '&times;' + H + '.';
} catch (e) {
  document.body.innerHTML = '<pre class="err">' + e.message + '</pre>';
  throw e;
}

// ⚠️ ARGB -> RGBA, a WORD at a time. A framebuffer word is 0xAARRGGBB, so in little-endian memory the
// bytes run B,G,R,A while ImageData wants R,G,B,A: red and blue have to be exchanged. A straight copy
// renders this figure's blue haze ORANGE - and no numeric test can see it, because the pixel VALUES
// are right either way.
function blit() {
  for (let i = 0; i < fb32.length; i++) {
    const v = fb32[i];
    px32[i] = 0xFF000000 | ((v & 0xFF) << 16) | (v & 0xFF00) | ((v >>> 16) & 0xFF);
  }
  ctx.putImageData(img, 0, 0);
}

const step = X['PROC_STEPFRAME'];
const control = X['PROC_CONTROL'];
// ⚠️ Only the commands that MOVE reset the counter, because only those reset the accumulation in
// the module (Control's `moved` flag). A reading or a gamma change rebuilds the tables from orbits
// that are already counted - showing 0 there would say the work had been thrown away when it had not.
const MOVES = new Set([2, 3, 4, 5, 6]);
const cmd = (c, a, b) => { control(BigInt(c), BigInt(a || 0), BigInt(b || 0));
                           if (MOVES.has(c)) traced = 0; };

// ⭐ THE PAGE CHOOSES THE ORBIT COUNT, and that is what makes orbits-per-second an honest number
// here: the module does not time itself, so the count is one the page can divide by its own
// measured milliseconds. It is adapted towards a 16 ms budget so a slow machine stays responsive
// instead of dropping frames.
let batch = 20000, traced = 0, running = true;
let last = performance.now(), acc = 0, n = 0, fps = 0;
let wAcc = 0, bAcc = 0, wMs = 0, bMs = 0, ops = 0;

const READINGS = ['NEBULA', 'AURORA', 'EMBER'];
let reading = 0, gammaTenths = 45, iterations = 5000;

requestAnimationFrame(function tick(t) {
  if (running) {
    const a0 = performance.now();
    step(BigInt(batch));               // i64 parameter: JavaScript must pass a BigInt
    const a1 = performance.now();
    blit();
    const a2 = performance.now();
    traced += batch;
    wAcc += a1 - a0; bAcc += a2 - a1;
    // hold ~16 ms of work per frame, in steps, so the count does not oscillate
    const work = a1 - a0;
    if (work > 20 && batch > 2000) batch = Math.round(batch * 0.8);
    else if (work < 12) batch = Math.round(batch * 1.15);
    acc += t - last; n++;
    if (acc >= 500) {
      fps = n * 1000 / acc; wMs = wAcc / n; bMs = bAcc / n;
      ops = wMs > 0 ? batch / (wMs / 1000) : 0;
      acc = 0; n = 0; wAcc = 0; bAcc = 0;
    }
    hud.textContent = fps.toFixed(1) + ' fps · ' + Math.round(ops).toLocaleString('en-US') +
                      ' orbits/s · trace ' + wMs.toFixed(1) + ' ms · blit ' + bMs.toFixed(1) + ' ms';
    hud2.textContent = traced.toLocaleString('en-US') + ' orbits · ' + READINGS[reading] +
                       ' · gamma ' + (gammaTenths / 10).toFixed(1) + ' · iter ' + iterations;
  }
  last = t;
  requestAnimationFrame(tick);
});

// The canvas is scaled by CSS, so a click has to be brought back into framebuffer pixels before it
// means anything: a pixel of the picture IS a point of the complex plane, and that mapping is the
// module's, not the page's.
function pixelOf(ev) {
  const r = cv.getBoundingClientRect();
  return [Math.floor((ev.clientX - r.left) * W / r.width),
          Math.floor((ev.clientY - r.top)  * H / r.height)];
}
cv.addEventListener('click', (ev) => { const [x, y] = pixelOf(ev); cmd(2, x, y); });
cv.addEventListener('contextmenu', (ev) => { ev.preventDefault(); cmd(3); });

document.getElementById('toggle').onclick = (e) => {
  running = !running; e.target.textContent = running ? 'pause' : 'resume';
};
document.getElementById('reading').onclick = (e) => {
  reading = (reading + 1) % 3; cmd(0, reading);
  e.target.textContent = 'reading: ' + READINGS[reading];
};
document.getElementById('gdown').onclick = () => { gammaTenths = Math.max(12, gammaTenths - 5); cmd(1, gammaTenths); };
document.getElementById('gup').onclick   = () => { gammaTenths = Math.min(120, gammaTenths + 5); cmd(1, gammaTenths); };
document.getElementById('idown').onclick = () => { iterations = Math.max(50, iterations >> 1); cmd(6, iterations); };
document.getElementById('iup').onclick   = () => { iterations = Math.min(20000, iterations * 2); cmd(6, iterations); };
document.getElementById('home').onclick  = () => { cmd(4); };
document.getElementById('restart').onclick = () => { cmd(5); };
</script>
