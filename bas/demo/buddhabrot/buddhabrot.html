<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>buddhabrot.wasm</title>
<style>
  /* The page keeps the visual language voxel_landscape.html established for these demos - dark,
     monospace, the picture carrying the page - and commits to it deliberately rather than following
     the viewer's theme: the subject is a figure drawn in light on black, and a light ground would
     put a white frame around a black photograph. Every colour is therefore painted explicitly.
     The one accent is taken from the picture itself: the orange of the long-lived orbits. */
  :root {
    color-scheme: dark;
    --ground:  #0b0d10;
    --panel:   #161b22;
    --edge:    #262d36;
    --edge-lit:#3a444f;
    --ink:     #c9d1d9;
    --ink-dim: #7d8590;
    --accent:  #e0813f;   /* the red channel of the figure: orbits that lived longest */
    --live:    #9fe8b0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;          /* no double-tap zoom: every tap here means something */
  }
  header { padding: 16px 16px 8px; text-align: center; }
  h1 { margin: 0 0 3px; font-size: 16px; font-weight: 600; letter-spacing: .01em; }
  .sub { color: var(--ink-dim); font-size: 12px; }

  .wrap { position: relative; margin: 4px 0 8px; line-height: 0; }
  canvas {
    display: block; image-rendering: pixelated;
    width: min(94vw, 620px); height: auto; aspect-ratio: 1;
    border: 1px solid var(--edge); border-radius: 6px; background: #000;
    /* ⚠️ `pointer`, not `crosshair`. Safari on iOS decides whether an element is CLICKABLE partly
       from its cursor, and a canvas that is only `crosshair` can swallow the tap. */
    cursor: pointer; touch-action: manipulation;
  }
  /* A tap has to be visibly received. Zooming empties the picture on purpose - the counts are
     thrown away and the seed starts again - so for a second or two after a tap there is very
     little to see, and without this the demo reads as broken exactly when it is working. */
  .ping {
    position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border: 2px solid var(--accent); border-radius: 50%;
    pointer-events: none; opacity: 0; transform: scale(.35);
  }
  .ping.on { animation: ping .55s ease-out; }
  @keyframes ping {
    0%   { opacity: 1; transform: scale(.35); }
    100% { opacity: 0; transform: scale(1.5); }
  }
  @media (prefers-reduced-motion: reduce) { .ping.on { animation: none; opacity: 0; } }
  .hud, .hud2 {
    position: absolute; left: 8px; padding: 3px 8px; border-radius: 4px;
    background: rgba(0,0,0,.62); font-size: 11.5px; line-height: 1.45;
    font-variant-numeric: tabular-nums; pointer-events: none;
    max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden;
  }
  .hud  { top: 8px;    color: var(--live); }
  .hud2 { bottom: 8px; color: var(--ink-dim); }

  .hint { color: var(--ink-dim); font-size: 12px; padding: 2px 16px 10px; text-align: center; }
  .hint b { color: var(--accent); font-weight: 600; }

  /* Controls are laid out as a grid rather than a wrapping row: on a phone that keeps every target
     the same size and stops the last button dangling alone on its own line. */
  .bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    width: min(94vw, 620px); padding: 0 0 14px;
  }
  button {
    font: inherit; font-size: 12.5px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--edge); border-radius: 6px; min-height: 42px; padding: 6px 8px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: background .12s ease, border-color .12s ease;
  }
  button:hover { background: var(--edge); }
  button:active { background: var(--edge-lit); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.wide { grid-column: span 2; }
  @media (max-width: 430px) { .bar { grid-template-columns: repeat(3, 1fr); } }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }

  .note { color: var(--ink-dim); font-size: 12px; max-width: 62ch; text-align: left;
          padding: 0 18px 28px; }
  .note b { color: var(--ink); font-weight: 600; }
  .note code { color: var(--accent); }
  .err { color: #ff7b72; white-space: pre-wrap; padding: 16px; }
</style>
<header>
  <h1>buddhabrot.wasm</h1>
  <div class="sub">written in BASIC, compiled to WebAssembly &mdash; no interpreter, no runtime library</div>
</header>

</div>

function decode(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const hud = document.getElementById('hud');
const hud2 = document.getElementById('hud2');
const noteEl = document.getElementById('note');
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');

let memory = null;

// The module writes through a byte sink, and a line can arrive in pieces, so it is assembled here.
let pending = '', viewLine = '';
function collect(text) {
  pending += text;
  let nl;
  while ((nl = pending.indexOf('\n')) >= 0) {
    const line = pending.slice(0, nl).trim();
    pending = pending.slice(nl + 1);
    const n = line.split(/\s+/);
    if (n[0] === 'view' && n.length >= 4) {
      const zoom = parseFloat(n[1]), re = parseFloat(n[2]), im = parseFloat(n[3]);
      viewLine = '×' + (zoom < 10 ? zoom.toFixed(zoom % 1 ? 1 : 0) : Math.round(zoom)) +
                 ' at ' + re.toFixed(4) + (im < 0 ? ' − ' : ' + ') + Math.abs(im).toFixed(4) + 'i';
    }
  }
}

// The module's imports. Output is a BYTE SINK - the page never formats a number, or the browser and
// the native run would stop being comparable. Once it is running this program prints nothing.
const imports = { env: {
  // ⛔ This is not a log. PROC_CONTROL prints one line saying where the view is now, because the
  // module is the only thing that knows and the alternative - the page keeping its own copy of the
  // pixel-to-plane mapping - is a second description of the one thing that must be described once.
  write: (ptr, len) => { collect(new TextDecoder().decode(new Uint8Array(memory.buffer, ptr, len))); },
  now: () => { const d = new Date();
               return (d.getTime() - d.getTimezoneOffset() * 60000) / 86400000 + 25569; },
  // WebAssembly has no transcendental instructions, so the host supplies them.
  sin: Math.sin,   cos: Math.cos,   tan: Math.tan,   atn: Math.atan,
  exp: Math.exp,   log: Math.log,   log10: Math.log10, log2: Math.log2,
  asin: Math.asin, acos: Math.acos, sinh: Math.sinh, cosh: Math.cosh
}};

let X, W, H, FB, img, fb32, px32;

// ⛔ INSTANTIATED ASYNCHRONOUSLY, and that is not a style preference. `new WebAssembly.Module(bytes)`
// is synchronous, and a browser refuses synchronous compilation of a buffer larger than 4 KB on the
// main thread - this module is 25. WebAssembly.instantiate has no such limit and is what works on a
// phone as well as on a desktop.
WebAssembly.instantiate(decode(B64), imports).then((r) => {
  start(r.instance.exports, decode(B64).length);
}).catch((e) => {
  // Two things cause this and neither is worth making the reader guess at: a browser that will not
  // compile WebAssembly on this page, or a truncated file.
  document.body.innerHTML =
    '<div class="err"><b>The module did not start.</b>\n\n' + e.message + '\n\n' +
    'This page compiles a 25 KB WebAssembly module carried inside it. If the browser refuses to ' +
    'compile it here, the same page opened as a local file ' +
    '(bas/demo/buddhabrot/buddhabrot.html in the repository) runs without that restriction.</div>';
});

function start(exports, byteLength) {
  X = exports;
  memory = X.memory;
  X.main();                       // sets the screen up and draws the first frame
  W = X.screen_w.value; H = X.screen_h.value; FB = X.screen_ptr.value;
  cv.width = W; cv.height = H;
  img = ctx.createImageData(W, H);
  fb32 = new Uint32Array(memory.buffer, FB, W * H);
  px32 = new Uint32Array(img.data.buffer);
  const bytes = { length: byteLength };
  noteEl.innerHTML =
    '<b>What you are looking at.</b> The usual Mandelbrot picture colours each point by how long it ' +
    'takes to escape. This one asks where the escaping orbits <i>go</i> on their way out, and answers ' +
    'by throwing millions of random points at the plane and counting how often each pixel is passed ' +
    'through. Turned a quarter turn, the density map looks like a seated figure.' +
    '<br><br><b>The colour is a third question, not a palette.</b> Each channel counts a different band ' +
    'of orbit lifetime: blue died within fifty steps, green fifty to five hundred, red everything ' +
    'longer. Nine escaping orbits in ten die young, so the flat haze goes to blue &mdash; and the ' +
    'structure is red because only red holds it. <code>NEBULA</code> is that; <code>AURORA</code> ' +
    'exchanges red and blue; <code>EMBER</code> adds the three back together, which is the ' +
    'single-channel Buddhabrot everyone has seen.' +
    '<br><br><b>Zooming shows you why Metropolis-Hastings exists.</b> A Mandelbrot zoom narrows both ' +
    'what you draw and what you compute. Here the view narrows but the sampling cannot, because an ' +
    'orbit crossing your window may have started anywhere &mdash; so about three quarters of the ' +
    'signal is lost at every doubling, and four steps in the picture stops converging in any useful ' +
    'time. That is the problem the technique was invented to solve, and this is it happening.' +
    '<br><br>' + Math.round(bytes.length / 1024) + '&nbsp;KB of WebAssembly, ' + W + '&times;' + H +
    '. The same source runs natively at 391 000 orbits a second interpreted and 1 381 000 compiled; ' +
    'in a browser it draws a framebuffer that hashes the same, byte for byte.';
  step = X['PROC_STEPFRAME'];
  control = X['PROC_CONTROL'];
  wire();
  requestAnimationFrame(tick);
}

// ⛔⛔ THE VIEW IS REBUILT WHEN THE MODULE'S MEMORY GROWS, and this is the failure that looks like
// nothing at all. A typed array over memory.buffer is DETACHED the moment the WebAssembly memory
// grows: its length becomes 0, no exception is raised, and the loop below simply copies nothing - so
// the canvas freezes on the last frame it managed while the counters go on rising and every control
// still works underneath. Measured on this program: the memory grows at about 1 240 000 orbits, when
// the brightest pixel passes 4 095 and the level table is re-dimensioned. The page then never
// changed again, which is exactly what it looked like from a phone.
// ⭐ Comparing .buffer catches it whatever the cause; screen_ptr is re-read with it because a
// reallocation is free to move the framebuffer even when this one does not.
function refreshFrameView() {
  if (fb32.length === 0 || fb32.buffer !== memory.buffer) {
    FB = X.screen_ptr.value;
    fb32 = new Uint32Array(memory.buffer, FB, W * H);
  }
}

// ⚠️ ARGB -> RGBA, a WORD at a time. A framebuffer word is 0xAARRGGBB, so in little-endian memory the
// bytes run B,G,R,A while ImageData wants R,G,B,A: red and blue have to be exchanged. A straight copy
// renders this figure's blue haze ORANGE - and no numeric test can see it, because the pixel VALUES
// are right either way.
function blit() {
  refreshFrameView();
  for (let i = 0; i < fb32.length; i++) {
    const v = fb32[i];
    px32[i] = 0xFF000000 | ((v & 0xFF) << 16) | (v & 0xFF00) | ((v >>> 16) & 0xFF);
  }
  ctx.putImageData(img, 0, 0);
}

// ⚠️ Bound in start(), not here. The module is instantiated ASYNCHRONOUSLY, so at the moment this
// line is reached X does not exist yet - reading its exports here threw before the page had drawn
// anything, which is the whole failure mode the switch to WebAssembly.instantiate introduced.
let step, control;
// ⚠️ Only the commands that MOVE reset the counter, because only those reset the accumulation inside
// the module. A reading or a gamma change rebuilds the tables from orbits already counted - showing 0
// there would say the work had been thrown away when it had not.
const MOVES = new Set([2, 3, 4, 5, 6]);
// ⭐ AND A COMMAND REFRESHES THE READOUT AT ONCE. Throttling the numbers to four times a second is
// right for the ones that stream past on their own; making a change YOU asked for wait a quarter of
// a second before it is acknowledged is not the same thing, and reads as the tap having missed.
const cmd = (c, a, b) => { control(BigInt(c), BigInt(a || 0), BigInt(b || 0));
                           if (MOVES.has(c)) traced = 0;
                           hudAt = 0; };

// ⭐ THE PAGE CHOOSES THE ORBIT COUNT, and that is what makes orbits-per-second honest here: the
// module never times itself, so the count is one the page can divide by its own measured
// milliseconds. It is steered towards a 16 ms slice, so a slow phone traces fewer orbits per frame
// instead of dropping frames.
let batch = 4000, traced = 0, running = true;
let last = performance.now(), acc = 0, n = 0, fps = 0, hudAt = 0;
let wAcc = 0, bAcc = 0, wMs = 0, bMs = 0, ops = 0;

const READINGS = ['NEBULA', 'AURORA', 'EMBER'];
let reading = 0, gammaTenths = 45, iterations = 5000;
const fmt = (v) => v.toLocaleString('en-US');

function tick(t) {
  if (running) {
    const a0 = performance.now();
    step(BigInt(batch));               // i64 parameter: JavaScript must pass a BigInt
    const a1 = performance.now();
    blit();
    const a2 = performance.now();
    traced += batch;
    wAcc += a1 - a0; bAcc += a2 - a1;
    const work = a1 - a0;
    if (work > 20 && batch > 500) batch = Math.max(500, Math.round(batch * 0.8));
    else if (work < 12) batch = Math.round(batch * 1.15);
    acc += t - last; n++;
    if (acc >= 500) {
      fps = n * 1000 / acc; wMs = wAcc / n; bMs = bAcc / n;
      ops = wMs > 0 ? batch / (wMs / 1000) : 0;
      acc = 0; n = 0; wAcc = 0; bAcc = 0;
    }
    // ⛔ THE PICTURE RUNS AT SIXTY FRAMES A SECOND; THE NUMBERS MUST NOT. A six-digit count rewritten
    // every seventeen milliseconds is a blur where a number should be, and a figure nobody can read
    // is worse than none - it takes the space of one. Four times a second is fast enough that a
    // change you caused feels immediate and slow enough that the digits stand still.
    if (t - hudAt >= 250) {
      hudAt = t;
      hud.textContent = fps.toFixed(0) + ' fps · ' + fmt(Math.round(ops)) + ' orbits/s · ' + viewLine;
      hud2.textContent = fmt(traced) + ' orbits · ' + READINGS[reading] +
                         ' · γ' + (gammaTenths / 10).toFixed(1) + ' · iter ' + fmt(iterations);
    }
  }
  last = t;
  requestAnimationFrame(tick);
}

// A phone in a pocket should not be tracing orbits. Pausing on hide costs nothing and the button
// still says what the state is when you come back.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) setRunning(false);
});

// The canvas is scaled by CSS, so a tap has to be brought back into framebuffer pixels before it
// means anything. Only the ARITHMETIC of the scale is the page's; what a pixel MEANS belongs to the
// module, which is why the coordinates go straight to it and come back as a printed line.
function pixelOf(ev) {
  const r = cv.getBoundingClientRect();
  return [Math.floor((ev.clientX - r.left) * W / r.width),
          Math.floor((ev.clientY - r.top)  * H / r.height)];
}

const pingEl = document.getElementById('ping');
function zoomAt(ev) {
  const r = cv.getBoundingClientRect();
  pingEl.style.left = (ev.clientX - r.left + cv.offsetLeft) + 'px';
  pingEl.style.top  = (ev.clientY - r.top  + cv.offsetTop)  + 'px';
  pingEl.classList.remove('on'); void pingEl.offsetWidth; pingEl.classList.add('on');
  const [x, y] = pixelOf(ev);
  cmd(2, x, y);
}

// ⛔ POINTERUP AND CLICK, WITH A GUARD, and not click alone. A canvas is not a control, and a touch
// browser will not always synthesise a click on one - which is exactly how "tap to zoom" can do
// nothing on a phone while working on every desktop it was tried on. pointerup fires on any pointer
// there is; the movement and duration tests keep a scroll or a long press from counting as a tap,
// and `handled` stops the synthesised click from zooming a second time when both do arrive.
let downX = 0, downY = 0, downT = 0, handled = -1e9;
cv.addEventListener('pointerdown', (ev) => { downX = ev.clientX; downY = ev.clientY; downT = performance.now(); });
cv.addEventListener('pointerup', (ev) => {
  if (ev.button === 2) return;                                    // the right button zooms out below
  const dx = ev.clientX - downX, dy = ev.clientY - downY;
  if (dx * dx + dy * dy > 400) return;                            // a drag, not a tap
  if (performance.now() - downT > 700) return;                    // a long press, not a tap
  handled = performance.now();
  zoomAt(ev);
});
cv.addEventListener('click', (ev) => {
  if (performance.now() - handled < 900) return;                  // pointerup already did this one
  zoomAt(ev);
});
// Right-click zooms out where there is a right button; the control below is the one a phone uses.
cv.addEventListener('contextmenu', (ev) => { ev.preventDefault(); cmd(3); });

const toggleBtn = document.getElementById('toggle');
function setRunning(v) { running = v; toggleBtn.textContent = v ? 'pause' : 'resume'; }

const readingBtn = document.getElementById('reading');

function wire() {
  toggleBtn.onclick = () => setRunning(!running);
  readingBtn.onclick = () => {
    reading = (reading + 1) % 3; cmd(0, reading);
    readingBtn.textContent = READINGS[reading];
  };
  document.getElementById('zoomout').onclick = () => cmd(3);
  document.getElementById('home').onclick    = () => cmd(4);
  document.getElementById('restart').onclick = () => cmd(5);
  document.getElementById('gdown').onclick = () => { gammaTenths = Math.max(12, gammaTenths - 5); cmd(1, gammaTenths); };
  document.getElementById('gup').onclick   = () => { gammaTenths = Math.min(120, gammaTenths + 5); cmd(1, gammaTenths); };
  document.getElementById('idown').onclick = () => { iterations = Math.max(50, iterations >> 1); cmd(6, iterations); };
  document.getElementById('iup').onclick   = () => { iterations = Math.min(20000, iterations * 2); cmd(6, iterations); };
}
</script>
